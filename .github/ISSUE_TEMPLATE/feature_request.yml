name: 功能建议
description: 提议新的字帖功能或体验改进
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景
      description: 请说明谁在什么情况下需要这个功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方法
      description: 可选填写。
